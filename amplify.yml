version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install --legacy-peer-deps
    build:
      commands:
        - echo "Building with production configuration..."
        - cat src/environments/environment.prod.ts
        - npm run build -- --configuration production
        - echo "Build complete."
        - ls dist/trendzy/browser/ || true
  artifacts:
    baseDirectory: frontend/dist/trendzy/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customRules:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
    target: /index.html
    status: '200'
