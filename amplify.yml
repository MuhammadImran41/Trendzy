version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build -- --configuration production
  artifacts:
    baseDirectory: frontend/dist/trendzy/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
